##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


# Pavucontrol
windowrule = center 1, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = float, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$

# Define default workspace for applications
windowrule = workspace 1 silent, class:^(zen)(.*)$
windowrule = workspace 2 silent, class:^(jetbrains-pycharm)$
windowrule = workspace 2 silent, class:^(obsidian)$
windowrule = workspace 3 silent, class:^(thunderbird)$
windowrule = workspace 4 silent, class:^(vesktop|discord|Slack)$
windowrule = workspace 5 silent, class:^(steam)$
windowrule = workspace 5 silent, class:^(net.lutris.Lutris)$
# windowrulev2 = workspace 1, class:^(zen)(.*)$

# Prevent Hypridle when in fullscreen
windowrule = idleinhibit fullscreen, class:^(*)$
windowrule = idleinhibit fullscreen, title:^(*)$
windowrule = idleinhibit fullscreen, fullscreen:1
