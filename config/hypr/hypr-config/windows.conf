##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
# 0.53+ syntax: matchers are `match:<prop> <regex>`, effect fields take a value.

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus 1, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0


# Pavucontrol
windowrule = center 1, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = float 1, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$

# Quickshell panel + toasts (blur backdrop)
layerrule = blur, qs-panel
layerrule = ignorezero, qs-panel
layerrule = ignorealpha 0.3, qs-panel

# Define default workspace for applications
windowrule = workspace 1 silent, match:class ^(zen)(.*)$
windowrule = workspace 2 silent, match:class ^(jetbrains-pycharm)$
windowrule = workspace 2 silent, match:class ^(obsidian)$
windowrule = workspace 3 silent, match:class ^(thunderbird)$
windowrule = workspace 4 silent, match:class ^(vesktop|discord|Slack)$
windowrule = workspace 5 silent, match:class ^(steam)$
windowrule = workspace 5 silent, match:class ^(net.lutris.Lutris)$

# Prevent Hypridle when in fullscreen
windowrule = idle_inhibit fullscreen, match:fullscreen 1
