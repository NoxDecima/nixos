################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1,1920x1080@240.00Hz,auto,auto
monitor=DP-1,1920x1080@60,auto-left, auto, transform, 1
monitor=,preferred,auto,auto, mirror, HDMI-A-1

# Window settings
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1


workspace = 3, monitor:DP-1, default:true
workspace = 4, monitor:DP-1

# Ensure HDMI-A-1is the primary monitor for XWayland (important for games for example)
exec-once = xrandr --output HDMI-A-1 --primary


